name: CI

# Every push to main and every pull request against it. Nothing here
# deploys — the workflow's only job is to say whether the change is safe,
# and a pipeline that also ships is a pipeline people learn to skip.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. A PR under active
# work otherwise queues four runs of a twenty-minute job to tell you about
# a commit that no longer exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Fast, no services. It fails in ninety seconds on a typo rather than
  # after the database has come up and the site has been built.
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm/action-setup must run before setup-node: `cache: pnpm` resolves
      # the store path by calling pnpm, and finds nothing if pnpm is not on
      # PATH yet. Swapping these two lines costs the dependency cache
      # silently — the run still passes, it just installs from scratch.
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck
      - run: pnpm turbo lint

      # Two properties nothing else enforces: no shared package imports
      # React (two apps, two React versions, kept apart by pnpm's isolated
      # store), and @ekmool/core has no barrel export (the script budget
      # has single-digit KB of headroom). Both are greps; see the script.
      - run: pnpm check:packages

      # Pure arithmetic — GST, coupons, money, delivery bands — with no
      # server and no database, so it belongs in the fast job rather than
      # behind MySQL coming up.
      - run: pnpm --filter @ekmool/core test

  # The real one: a MySQL, a Redis, a production build, and every suite
  # that talks to a running server.
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    needs: static

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: ekmool
          MYSQL_USER: ekmool
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        # Same reasoning as docker-compose: authenticate over TCP as the
        # application user, which proves the user and the database exist
        # rather than only that a server is listening.
        options: >-
          --health-cmd="mysql -h 127.0.0.1 --protocol=TCP -u ekmool -pci_password -e 'SELECT 1' ekmool"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: ekmool
      DATABASE_PASSWORD: ci_password
      DATABASE_NAME: ekmool
      MYSQL_ROOT_PASSWORD: ci_root
      REDIS_URL: redis://127.0.0.1:6379
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      # Test-run values. Not secrets and not reused anywhere: no third
      # party is configured in CI, so nothing here authenticates against
      # anything. Deliberately literal rather than repository secrets —
      # a workflow that needs secrets to run cannot run on a fork's PR.
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret-0123456789abcdef0123456789abcdef
      REVALIDATE_SECRET: ci-revalidate-0123456789abcdef0123456789abcdef
      PORT: "3100"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Schema and catalogue
        run: |
          pnpm --filter web db:migrate
          pnpm --filter web db:seed

      - name: Build
        run: |
          pnpm --filter web build
          pnpm --filter web standalone

      # `standalone:start` rather than a literal path: with
      # outputFileTracingRoot at the workspace root the entry point is
      # apps/web/.next/standalone/apps/web/server.js, and that path is
      # already spelled once in apps/web/package.json. Two copies drift.
      - name: Start the server
        run: |
          pnpm --filter web standalone:start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up"
          cat server.log
          exit 1

      - name: Redis is actually in use
        run: |
          backing=$(curl -s http://localhost:3100/api/health | grep -o '"rateLimiter":"[a-z]*"')
          echo "$backing"
          test "$backing" = '"rateLimiter":"redis"'

      # Sequential, and each on its own line so a failure names itself in
      # the job summary. They are not parallel-safe: several drive checkout
      # through the same rate limiter, and running them together produces
      # 429s that look like failures and are not. That is why they are run
      # as `pnpm --filter web <suite>` and not through Turbo — a task graph
      # would parallelise them — and why they must not become a matrix.
      - name: Structured data
        run: pnpm --filter web validate:schema

      - name: Admin
        run: pnpm --filter web test:admin

      # Runs early, and before anything that publishes a review: its
      # empty-state check only means something while the reviews table is
      # still empty, and it says so rather than failing if it is not.
      - name: Home page
        run: pnpm --filter web test:home 3100

      - name: Checkout
        run: pnpm --filter web test:checkout 3100

      - name: Account
        run: pnpm --filter web test:account 3100

      - name: Commerce
        run: pnpm --filter web test:commerce 3100

      - name: Consent and security headers
        run: pnpm --filter web test:consent 3100

      - name: Discovery
        run: pnpm --filter web test:discovery 3100

      - name: Promotions
        run: pnpm --filter web test:promotions 3100

      - name: Jobs
        run: pnpm --filter web test:jobs 3100

      - name: Offline and PWA
        run: pnpm --filter web test:offline 3100

      - name: Server log
        if: failure()
        run: cat server.log

  # Its own job so a failed budget is legible at a glance in the PR checks,
  # and so it can be re-run without repeating the suites.
  budget:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    needs: static

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: ekmool
          MYSQL_USER: ekmool
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 --protocol=TCP -u ekmool -pci_password -e 'SELECT 1' ekmool"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: ekmool
      DATABASE_PASSWORD: ci_password
      DATABASE_NAME: ekmool
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      REVALIDATE_SECRET: ci-revalidate-0123456789abcdef0123456789abcdef
      PORT: "3100"

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: |
          pnpm --filter web db:migrate
          pnpm --filter web db:seed

      - run: |
          pnpm --filter web build
          pnpm --filter web standalone

      - name: Start the server
        run: |
          pnpm --filter web standalone:start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

      # The gate that has caught the most regressions of anything here: SEO
      # 100, accessibility 100, and a per-page script budget with almost no
      # headroom. A generous budget catches nothing, which is the only
      # thing a budget is for.
      - name: Scores and script budget
        # `run` is not optional here. `pnpm audit` is a built-in command —
        # the vulnerability scanner — and it shadows a script of the same
        # name, so `pnpm --filter web audit 3100` fails with
        # ERR_PNPM_AUDIT_UNKNOWN_SUBCOMMAND and never reaches Lighthouse.
        # Every other script in this file has a name pnpm does not claim.
        run: pnpm --filter web run audit 3100

      # The raw reports, so a budget failure can be read rather than
      # guessed at — which request grew, and by how much. research/ stayed
      # at the repo root in the monorepo move, and scripts/audit.mjs writes
      # there rather than under apps/web, so this path is unchanged.
      # v6, not v5: upload-artifact@v5 still declares `using: node20` and
      # would keep the deprecation warning it was bumped to remove. checkout
      # and setup-node reach node24 at v5, which is why they differ here.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-reports
          path: research/audits/
          retention-days: 14
          if-no-files-found: ignore
