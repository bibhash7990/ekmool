# Reverse proxy for the Ekmool origin.
#
# Enabled with `docker compose --profile edge up -d`. Two jobs: compress
# responses so the Node process does not have to, and serve hashed build
# assets from cache. Load testing put gzip in Node as the largest CPU cost
# under traffic (docs/loadtest.md), which is what this removes.

upstream ekmool_app {
    # Docker's embedded DNS round-robins across replicas, so
    # `docker compose up -d --scale app=4` load-balances with no change here.
    # Worth doing: one Node process saturates a core at roughly 450 rps.
    server app:3000;
    keepalive 32;
}

# Cache zone for prerendered HTML.
proxy_cache_path /var/cache/nginx/ekmool levels=1:2 keys_zone=ekmool:16m
                 max_size=512m inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Product pages carry long descriptions and JSON-LD; 82 KB raw becomes
    # 14.8 KB gzipped.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml;

    client_max_body_size 2m;

    # Do not advertise the version on error pages.
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Hashed filenames — the content can never change under a given URL.
    location /_next/static/ {
        proxy_pass http://ekmool_app;
        proxy_cache ekmool;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /brand/ {
        proxy_pass http://ekmool_app;
        proxy_cache ekmool;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Anything that reads or writes per-visitor state. Caching these would
    # serve one shopper's cart or order to another, so they are never cached
    # and never collapsed onto a shared upstream request.
    #
    # `order` covers /order/… and /orders/…; `track` is the order lookup and
    # renders the signed-in customer's own history, so it belongs here too.
    location ~ ^/(api|cart|checkout|order|track|admin|account|monitoring|ingest) {
        proxy_pass http://ekmool_app;
        proxy_cache off;
        add_header Cache-Control "no-store" always;

        # Razorpay retries a webhook it thinks timed out, and each retry is
        # a fresh delivery to verify and ignore. Give the origin room.
        proxy_read_timeout 60s;
    }

    # Everything else is prerendered HTML. One minute at the edge is enough
    # to absorb a traffic spike without noticeably delaying a price change;
    # the origin's own ISR window is an hour.
    location / {
        proxy_pass http://ekmool_app;
        proxy_cache ekmool;
        proxy_cache_valid 200 301 302 1m;
        proxy_cache_valid 404 10s;

        # A spike on a cold page becomes one upstream request, not a thousand.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        # Keep serving the last good copy if the origin is restarting.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header X-Cache-Status $upstream_cache_status;
    }
}
