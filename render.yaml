# Render blueprint — https://render.com/docs/blueprint-spec
#
# One command deploys everything:
#
#   render blueprint launch
#
# or point Render at this repo once (New → Blueprint) and every push to
# main redeploys automatically.
#
# WHAT THIS DOES NOT CREATE: the MySQL database. Render offers Postgres,
# not MySQL, and this app is MySQL-only — 5,473 lines of MySQL SQL,
# SELECT ... FOR UPDATE for the GST invoice series, and utf8mb4_0900_ai_ci
# throughout. The database lives on Aiven; DATABASE_* below are marked
# sync:false so Render prompts for them rather than inventing values.
#
# Redis IS created here, as a Render Key Value instance.

services:
  # ---- The storefront ----
  - type: web
    name: ekmool
    runtime: docker
    dockerfilePath: ./Dockerfile
    # NOT the `runner` stage: that one expects its build to arrive on a
    # shared compose volume, which Render has no equivalent for. It would
    # start with an empty /app/dist and crash.
    region: singapore # closest Render region to India
    # Free spins down after 15 minutes without inbound traffic and takes
    # about a minute to wake, during which a visitor sees a loading page.
    # Fine while testing; change to `starter` before you advertise the
    # site, because a minute is long enough to lose a sale.
    #
    # Free also cannot receive private network traffic — see the cron
    # section below, which is why the jobs address the public URL.
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    # NOTE: next build prerenders every product page from MySQL, so the
    # DATABASE_* values below must be present as BUILD-time env, not only at
    # run time. Render passes service env vars to the Docker build, so the
    # same entries cover both.
    envVars:
      # --- Database (Aiven) — set these in the dashboard ---
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Aiven signs with a per-project CA; without the PEM the handshake
      # fails outright rather than falling back to plaintext.
      - key: DATABASE_SSL_CA
        sync: false

      # --- Redis: wired automatically from the instance below ---
      - key: REDIS_URL
        fromService:
          name: ekmool-redis
          type: keyvalue
          property: connectionString

      # --- App ---
      # Set to the service's own URL after the first deploy. A service
      # cannot reference itself with fromService — Render rejects the
      # blueprint as circular — and RENDER_EXTERNAL_URL does not exist at
      # build time, which is when a NEXT_PUBLIC_ var is inlined.
      #
      # First deploy: leave blank, note the assigned onrender.com URL, set
      # it here, redeploy. Baked into the client bundle, so a later change
      # needs a rebuild rather than a restart.
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Regenerate these; do not reuse development values.
      - key: CRON_SECRET
        generateValue: true
      - key: REVALIDATE_SECRET
        generateValue: true
      # Signs the customer session cookie. Unset, a per-process secret is
      # generated and every restart signs every customer out.
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false

      # --- Everything below is optional: each has a documented inert
      #     state, and the site still takes COD orders with all of them
      #     absent. See docs/keys-needed.md.
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false

      # --- Seller identity (GST). All four together or none: they decide
      #     both whether GST is recorded and whether the invoice is a tax
      #     invoice. s.32 CGST Act forbids an unregistered person from
      #     collecting tax, so it is one switch, not four.
      - key: SELLER_LEGAL_NAME
        sync: false
      - key: SELLER_GSTIN
        sync: false
      - key: SELLER_STATE
        sync: false
      - key: SELLER_ADDRESS
        sync: false
      - key: SELLER_FSSAI
        sync: false

      # --- Grievance officer: required by Rule 4(5) of the Consumer
      #     Protection (E-Commerce) Rules 2020 before you trade.
      - key: GRIEVANCE_OFFICER_NAME
        sync: false
      - key: GRIEVANCE_OFFICER_EMAIL
        sync: false
      - key: GRIEVANCE_OFFICER_PHONE
        sync: false

  # ---- The three scheduled jobs: NOT declared here ----
  #
  # Render cron jobs have no free tier — $1/month minimum each, so three of
  # them cost more than the free web service saves. They are left out
  # rather than silently added to your bill.
  #
  # They would also not work against a free web service even if paid for: a
  # free instance cannot receive private network traffic, and `property:
  # host` resolves to a private hostname.
  #
  # Two ways to run them meanwhile:
  #
  #   1. An external scheduler (cron-job.org, GitHub Actions) POSTing to
  #      https://<your-app>.onrender.com/api/jobs/<name> with the header
  #      x-cron-secret. Read CRON_SECRET from the Render dashboard — it is
  #      generated there, so it is not in your .env.local.
  #
  #   2. `npm run cron` on any always-on machine; scripts/cron-runner.mts
  #      drives the same three jobs on the same IST schedule.
  #
  # Uncomment nothing here until the web service is on a paid plan. What is
  # missed while they are off: abandoned-payment reminders, the low-stock
  # report, and automatic cancellation of stale unpaid orders — none of
  # which breaks the shop, all of which are work someone does by hand.

  # ---- Redis: shared rate-limit buckets and cache purges ----
  #
  # Without it each instance keeps its own in-memory buckets, so N replicas
  # turn a 10/min checkout limit into N×10, and an admin edit purges only
  # the instance that served the form.
  - type: keyvalue
    name: ekmool-redis
    region: singapore
    # Free Key Value has an ephemeral filesystem: everything is lost on
    # restart. That is survivable here — rate-limit buckets and cache
    # purge markers are both disposable, and losing them means one window
    # of over-permissive limits, not corrupted data. No orders live here.
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: [] # reachable only from inside Render
